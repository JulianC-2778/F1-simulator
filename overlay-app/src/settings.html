<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TORCS AI Overlay Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>TORCS AI Overlay Settings</h1>
        <p id="backendStatus">Checking midware service...</p>
      </div>
      <button id="reloadBackend" class="secondary" type="button">Reload</button>
    </header>

    <main class="settings-grid">
      <section class="panel">
        <h2>Connection</h2>
        <label>
          WebSocket URL
          <input id="wsUrl" type="text" spellcheck="false" />
        </label>
        <label>
          Reconnect interval
          <input id="reconnectDelayMs" type="number" min="500" step="500" />
        </label>
        <label>
          Ping interval
          <input id="pingIntervalMs" type="number" min="1000" step="1000" />
        </label>
        <button id="saveOverlay" type="button">Save Overlay Settings</button>
        <p id="overlayNote" class="note"></p>
      </section>

      <section class="panel">
        <h2>Model API</h2>
        <label>
          Base URL
          <input id="baseUrl" type="text" spellcheck="false" placeholder="http://127.0.0.1:1234/v1" />
        </label>
        <label>
          API Key
          <input id="apiKey" type="password" spellcheck="false" placeholder="Leave blank to keep saved key" />
        </label>
        <label>
          Model
          <input id="model" type="text" spellcheck="false" placeholder="granite-4.1-8b" />
        </label>
        <label>
          Temperature <span id="temperatureValue">0.80</span>
          <input id="temperature" type="range" min="0" max="2" step="0.05" />
        </label>
        <label class="check-row">
          <input id="stream" type="checkbox" />
          Streaming output
        </label>
        <button id="saveApi" type="button">Save Model API</button>
        <p id="apiNote" class="note"></p>
      </section>

      <section class="panel">
        <h2>Voice</h2>
        <label class="check-row">
          <input id="voiceEnabled" type="checkbox" />
          Enable voice playback
        </label>
        <label>
          Voice
          <select id="voiceSelect">
            <option value="">System default</option>
          </select>
        </label>
        <label>
          Rate <span id="voiceRateValue">1.1</span>
          <input id="voiceRate" type="range" min="0.5" max="2" step="0.1" />
        </label>
        <label>
          Pitch <span id="voicePitchValue">1.0</span>
          <input id="voicePitch" type="range" min="0.5" max="2" step="0.1" />
        </label>
        <label>
          Volume <span id="voiceVolumeValue">1.00</span>
          <input id="voiceVolume" type="range" min="0" max="1" step="0.05" />
        </label>
        <div class="button-row">
          <button id="testVoice" class="secondary" type="button">Test Voice</button>
          <button id="saveVoice" type="button">Save Voice</button>
        </div>
        <p id="voiceNote" class="note"></p>
      </section>

      <section class="panel">
        <h2>Text-to-Speech (Server)</h2>
        <label class="check-row">
          <input id="ttsEnabled" type="checkbox" />
          Enable server-side TTS (audio comes from midware, not the browser)
        </label>
        <label>
          Provider
          <select id="ttsProvider">
            <option value="kokoro">Kokoro</option>
            <option value="custom_http">Custom HTTP</option>
          </select>
        </label>
        <label>
          Server URL
          <input id="ttsUrl" type="text" spellcheck="false" placeholder="http://127.0.0.1:8881/tts" />
        </label>
        <label>
          Voice
          <input id="ttsVoice" type="text" spellcheck="false" placeholder="af_heart" />
        </label>
        <label>
          Speed <span id="ttsSpeedValue">1.2</span>
          <input id="ttsSpeed" type="range" min="0.5" max="2" step="0.1" />
        </label>
        <label>
          Volume <span id="ttsVolumeValue">1.00</span>
          <input id="ttsVolume" type="range" min="0" max="4" step="0.05" />
        </label>
        <div id="ttsCustomFields" class="split" hidden>
          <label>
            API Key
            <input id="ttsApiKey" type="password" spellcheck="false" placeholder="Leave blank to keep saved key" />
          </label>
          <label>
            Model
            <input id="ttsModel" type="text" spellcheck="false" />
          </label>
          <label>
            Response format
            <select id="ttsResponseFormat">
              <option value="audio_bytes">Raw audio bytes</option>
              <option value="json_base64">JSON (base64 audio field)</option>
            </select>
          </label>
          <label>
            Audio field (JSON response only)
            <input id="ttsResponseAudioField" type="text" spellcheck="false" placeholder="audio" />
          </label>
          <label>
            MIME type
            <input id="ttsMime" type="text" spellcheck="false" placeholder="audio/wav" />
          </label>
          <label>
            Request body template
            <textarea id="ttsRequestTemplate" rows="6" spellcheck="false"></textarea>
          </label>
        </div>
        <button id="saveTts" type="button">Save TTS</button>
        <p id="ttsNote" class="note"></p>
      </section>
    </main>

    <script src="./settings.js"></script>
  </body>
</html>
